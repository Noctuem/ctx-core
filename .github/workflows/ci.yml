name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, dev extra)
        run: pip install -e .[dev]

      - name: Run full test suite
        run: python -m pytest -q

      # --- Live doctor-gate proof ---------------------------------------
      # ctx doctor is a hard, CI-gateable health check: it must exit 0 on
      # a clean corpus and non-zero once the corpus is actually corrupt.
      # `shell: bash` so the same commands run on both runners.

      - name: Doctor-gate proof -- build a scratch corpus from the template
        shell: bash
        run: python -c "import shutil; shutil.copytree('template', 'corpus_ok')"

      - name: Doctor-gate proof -- non-interactive init
        shell: bash
        run: |
          cat > answers.json <<'EOF'
          {"name": "CI", "working_style": "n/a", "communication_preferences": "n/a", "domain_purpose": "CI doctor-gate proof"}
          EOF
          ctx init --root corpus_ok --answers answers.json

      - name: Doctor-gate proof -- clean corpus passes
        shell: bash
        run: ctx doctor --root corpus_ok

      - name: Doctor-gate proof -- generate an event
        shell: bash
        run: ctx pack "smoke" --root corpus_ok

      - name: Doctor-gate proof -- corrupt the event log
        shell: bash
        run: printf 'not-json-garbage\n' >> corpus_ok/var/log/events.jsonl

      - name: Doctor-gate proof -- corrupted corpus fails
        shell: bash
        run: |
          if ctx doctor --root corpus_ok; then
            echo "expected 'ctx doctor' to exit non-zero on a corrupted event log" >&2
            exit 1
          fi

      # --- Example corpus, live fixture ---------------------------------
      # examples/corpus/ is a small, committed, realistic-shaped corpus
      # (see examples/corpus/README.md) -- distinct from the scratch
      # corpus_ok/ built from template/ above. It ships a pinned note and
      # a note deliberately oversized for its own small pack_budget_tokens,
      # so this proves both the doctor gate AND the packer's honest
      # oversized-drop behavior against real, non-scratch content.

      - name: Example corpus -- ctx doctor passes clean
        shell: bash
        run: ctx doctor --root examples/corpus

      - name: Example corpus -- ctx pack admits the pinned note, drops the oversized one
        shell: bash
        run: |
          ctx pack "help a new teammate ramp up on the product" --root examples/corpus > pack_output.txt
          cat pack_output.txt
          grep -q 'notes/support/faq.md' pack_output.txt || { echo "expected the pinned FAQ note in the manifest" >&2; exit 1; }
          grep -q '| pinned |' pack_output.txt || { echo "expected the FAQ note admitted with a pinned reason" >&2; exit 1; }
          grep -q 'notes/eng/deploy-runbook.md.*larger than the whole working budget' pack_output.txt || { echo "expected the oversized runbook dropped with the oversized reason" >&2; exit 1; }
